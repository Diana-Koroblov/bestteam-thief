name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv only. pip / venv / python -m are forbidden by the excellence guide.
      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff, zero violations)
        run: uv run ruff check .

      - name: File size (max 150 code lines)
        run: uv run python scripts/check_file_size.py

      - name: Secret scan
        run: uv run python scripts/scan_secrets.py --tracked

      - name: Tests and coverage
        run: uv run pytest
